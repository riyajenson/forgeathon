<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Forge-a-thon architecture: VS Code extension, forge-harness, TrueForge, model providers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- VS Code extension host -->
  <rect x="12" y="12" width="500" height="416" rx="10" fill="#f3f6fb" stroke="#7a8aa6" stroke-dasharray="5 4"/>
  <text x="26" y="34" font-weight="700" fill="#1f2a44">VS Code (Remote-WSL) · extension host process</text>

  <rect x="26" y="48" width="472" height="140" rx="8" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="40" y="70" font-weight="700" fill="#1f2a44">Forge extension (extension/)</text>
  <text x="40" y="92" fill="#333">• Inline edit: Ctrl+Alt+I → instruction → diff editor</text>
  <text x="40" y="111" fill="#333">• Per-hunk review: Accept All / Reject All / Choose Hunks; Undo</text>
  <text x="40" y="130" fill="#333">• Agent panel: streaming text, tool calls, context block,</text>
  <text x="52" y="147" fill="#333">fallback banner, Stop, command approval, session link</text>
  <text x="40" y="168" fill="#333">• EditorPort: readText (dirty buffer first), listFiles, applyText</text>

  <line x1="160" y1="188" x2="160" y2="224" stroke="#3b4252" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="170" y="211" fill="#3b4252" font-size="11">createHarness() / EditorPort, same process</text>

  <rect x="26" y="224" width="472" height="192" rx="8" fill="#ffffff" stroke="#2f9e44"/>
  <text x="40" y="246" font-weight="700" fill="#1f2a44">forge-harness (src/harness/)</text>
  <text x="40" y="267" fill="#333">• Turn controller: app turn ↔ TrueForge session/turn(s); approvals,</text>
  <text x="52" y="284" fill="#333">cancel, watchdog, retry, fallback, per-turn log</text>
  <text x="40" y="304" fill="#333">• Context engine: BM25, symbols, test/doc pairing, token budget</text>
  <text x="40" y="324" fill="#333">• Review core: search/replace → hunks, partial apply, sha256</text>
  <text x="40" y="344" fill="#333">• MCP server 127.0.0.1:47615 (bearer token, per-session scope):</text>
  <text x="52" y="361" fill="#333">gather_context, read_file, search_workspace, propose_edit,</text>
  <text x="52" y="378" fill="#333">run_command; deferred: find_symbol, list_files</text>
  <text x="40" y="402" fill="#2f9e44" font-style="italic">Writes only through approved propose_edit → EditorPort.applyText</text>

  <!-- TrueForge -->
  <rect x="636" y="48" width="352" height="210" rx="8" fill="#fff8e6" stroke="#e67700"/>
  <text x="650" y="70" font-weight="700" fill="#1f2a44">TrueForge 0.185.1 (local, :8790, SQLite)</text>
  <text x="650" y="92" fill="#333">• Agent loop: forge-inline, forge-coder</text>
  <text x="662" y="109" fill="#333">+ -fallback variants (agent/*.json)</text>
  <text x="650" y="130" fill="#333">• Sessions, turns, streamed events</text>
  <text x="650" y="150" fill="#333">• Approvals: propose_edit, run_command</text>
  <text x="650" y="170" fill="#333">• Deferred tools (call_tool), compaction</text>
  <text x="650" y="190" fill="#333">• Model router, HTTP retries, timeouts</text>
  <text x="650" y="210" fill="#333">• Sessions UI: every turn and tool call</text>
  <text x="650" y="230" fill="#333">• Configured by scripts/setup-trueforge</text>

  <rect x="636" y="316" width="352" height="100" rx="8" fill="#f8f0fc" stroke="#ae3ec9"/>
  <text x="650" y="338" font-weight="700" fill="#1f2a44">Model providers (config only)</text>
  <text x="650" y="359" fill="#333">primary + fallback, different providers:</text>
  <text x="650" y="378" fill="#333">Gemini, Groq, OpenRouter, Anthropic, OpenAI</text>
  <text x="650" y="397" fill="#333">or the scripted demo model (no keys)</text>

  <!-- harness → TrueForge -->
  <path d="M498,270 C570,270 566,130 636,130" fill="none" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="522" y="172" fill="#3b4252" font-size="11">SDK over HTTP:</text>
  <text x="522" y="186" fill="#3b4252" font-size="11">sessions, turns,</text>
  <text x="522" y="200" fill="#3b4252" font-size="11">approvals, cancel</text>
  <!-- TrueForge → MCP -->
  <path d="M636,236 C566,236 570,352 498,352" fill="none" stroke="#d9480f" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <text x="522" y="300" fill="#d9480f" font-size="11">MCP tools/call</text>
  <text x="522" y="314" fill="#d9480f" font-size="11">+ x-tfg-session-id</text>
  <!-- TrueForge → models -->
  <line x1="812" y1="258" x2="812" y2="316" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="820" y="292" fill="#3b4252" font-size="11">HTTPS</text>
</svg>
